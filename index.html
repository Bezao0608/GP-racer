<title>Turbo GP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Press+Start+2P&display=swap">
<style>
/* Layout: menu rolável com seleção de piloto, carro, câmbio, controle e pistas; jogo em tela cheia com tela dividida e controles embaixo. */
:root{
  --bg:#150f33; --panel:#231a4d; --panel2:#2e2362; --ink:#fff6e0; --mute:#a99cd6;
  --amber:#ffc400; --green:#1e9150; --red:#b0361c; --blue:#3d7bff; --line:#43378a;
  --px:'Press Start 2P','Courier New',monospace; --ui:'Chakra Petch','Trebuchet MS',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit}
.screen{position:absolute;inset:0;padding-left:inherit;padding-right:inherit}
#menu{overflow-y:auto;overflow-x:hidden;padding-block:14px 28px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--px);font-size:26px;line-height:1.2;margin:6px 0 0;color:var(--amber);letter-spacing:1px;text-shadow:3px 3px 0 #7a2e00}
.sub{margin:4px 0 0;color:var(--mute);font-size:13px}
h2{font-family:var(--px);font-size:10px;font-weight:400;margin:0 0 8px;color:var(--mute);letter-spacing:1px;text-transform:uppercase}
.name{width:100%;background:var(--panel);border:2px solid var(--line);color:var(--ink);font:700 18px var(--ui);padding:12px 14px;border-radius:6px;outline:none}
.name:focus{border-color:var(--amber)}
.cars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.car{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:10px;text-align:left;cursor:pointer;min-width:0}
.car[aria-pressed=true]{border-color:var(--amber);background:var(--panel2)}
.car canvas{width:100%;height:auto;image-rendering:pixelated;display:block;background:#3a3478;border-radius:4px}
.car b{display:block;margin:8px 0 2px;font-size:15px}
.car small{display:block;color:var(--mute);font-size:12px;line-height:1.3;min-height:32px}
.bars{display:grid;gap:3px;margin-top:6px}
.bar{display:grid;grid-template-columns:54px 1fr;align-items:center;gap:6px;font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
.bar i{display:block;height:6px;background:#1a1340;border-radius:3px;overflow:hidden}
.bar i u{display:block;height:100%;background:var(--amber)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:12px 8px;font-weight:700;font-size:14px;cursor:pointer;line-height:1.2}
.opt small{display:block;font-weight:500;color:var(--mute);font-size:11px;margin-top:3px}
.opt[aria-pressed=true]{border-color:var(--amber);background:var(--panel2)}
.sv{color:var(--amber);margin-left:6px}
.range{width:100%;height:32px;accent-color:var(--amber);margin:0}
.rl{display:flex;justify-content:space-between;color:var(--mute);font-size:11px}
.tracks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.trk{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:10px;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center;min-width:0}
.trk .n{font-family:var(--px);font-size:12px;color:var(--amber);width:22px;flex:none}
.trk span{display:block;min-width:0}
.trk b{display:block;font-size:14px;overflow-wrap:anywhere}
.trk small{color:var(--mute);font-size:11px}
.trk[aria-pressed=true]{border-color:var(--amber);background:var(--panel2)}
.trk[disabled]{opacity:.45;cursor:not-allowed}
.trk[disabled] .n{color:var(--mute)}
.pts{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.pts b{color:var(--amber);font-family:var(--px);font-size:12px}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;font-size:12px;cursor:pointer;padding:4px}
.go{font-family:var(--px);font-size:16px;background:var(--green);border:0;border-bottom:5px solid #0f5c30;border-radius:8px;padding:18px;cursor:pointer;color:#fff;letter-spacing:1px}
.go:active{transform:translateY(3px);border-bottom-width:2px}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

#game{background:#000;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);padding-top:env(safe-area-inset-top,0px)}
#stage{flex:1;min-height:0;position:relative}
#cv{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;display:block;background:#000}
#tb{position:absolute;top:4px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
#tb button{width:32px;height:32px;border-radius:50%;border:2px solid #fff6;background:#0009;font-size:15px;cursor:pointer;line-height:1;padding:0}
#tb button.off{opacity:.45}
#ctrl{flex:none;height:150px;background:#1b1444;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;touch-action:none}
#left{flex:none;width:136px;display:flex;align-items:center;justify-content:center;gap:8px}
#wheel{width:124px;height:124px;touch-action:none}
#wheel svg{width:100%;height:100%;display:block}
.arr{width:64px;height:100px;border-radius:14px;border:0;background:#33297a;font-size:30px;touch-action:none}
.arr.on,.pad.on{filter:brightness(1.5)}
#right{flex:1;min-width:0;display:flex;gap:8px;height:100%;align-items:stretch;justify-content:flex-end}
.pad{border:0;border-radius:16px;font-weight:700;font-size:17px;touch-action:none;padding:0 4px;min-width:0}
#bBrake{background:#342a6b;flex:1;max-width:76px;font-size:14px}
#bGas{background:#1e9150;flex:2;font-size:20px}
#bNit{background:#a8341a;flex:1.2;font-size:15px}
#gears{display:none;flex-direction:column;gap:6px;width:46px}
#gears .pad{flex:1;background:#4a3d9a;font-size:20px}
#result{position:absolute;inset:0;background:#0a0720ee;overflow-y:auto;padding:16px 0 20px}
#result .wrap{padding-inline:2px}
.big{font-family:var(--px);font-size:20px;color:var(--amber);margin:0;line-height:1.3}
.msg{margin:0;color:var(--ink);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--px);font-size:8px;font-weight:400;color:var(--mute);text-align:left;padding:4px 6px;text-transform:uppercase}
td{padding:4px 6px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;font-size:13px}
tr.me td{background:#3a2e7a;color:var(--amber);font-weight:700}
td.r,th.r{text-align:right}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{background:var(--panel2);border:2px solid var(--line);border-radius:8px;padding:14px 8px;font-weight:700;font-size:14px;cursor:pointer}
.btn.pri{background:var(--green);border-color:#0f5c30}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:360px){h1{font-size:20px}.cars{gap:8px}}
</style>
<div id="menu" class="screen">
  <div class="wrap">
    <div>
      <h1>TURBO GP</h1>
      <p class="sub">Campeonato de 8 GPs com 20 pilotos. Termine no pódio (top 3) para liberar o próximo GP.</p>
    </div>
    <div>
      <h2>Piloto</h2>
      <input id="pname" class="name" maxlength="12" autocomplete="off" placeholder="Seu nome" value="Bernardo">
    </div>
    <div>
      <h2>Nível</h2>
      <div class="seg three" id="diffSel">
        <button class="opt" data-v="0" aria-pressed="true">Fácil<small>Mais leve</small></button>
        <button class="opt" data-v="1" aria-pressed="false">Normal<small>Desafiador</small></button>
        <button class="opt" data-v="2" aria-pressed="false">Difícil<small>Rivais fortes</small></button>
      </div>
    </div>
    <div>
      <h2>Carro</h2>
      <div class="cars" id="carList"></div>
    </div>
    <div>
      <h2>Câmbio</h2>
      <div class="seg" id="gearSel">
        <button class="opt" data-v="auto" aria-pressed="true">Automático<small>O carro troca as marchas</small></button>
        <button class="opt" data-v="man" aria-pressed="false">Manual<small>Você troca com + e −</small></button>
      </div>
    </div>
    <div>
      <h2>Direção</h2>
      <div class="seg" id="ctlSel">
        <button class="opt" data-v="arrows" aria-pressed="false">Setas<small>Botões ◀ ▶</small></button>
        <button class="opt" data-v="wheel" aria-pressed="true">Volante<small>Gire na tela</small></button>
      </div>
    </div>
    <div>
      <h2>Sensibilidade da direção <span id="sensVal" class="sv">4</span></h2>
      <input type="range" id="sens" min="1" max="10" step="1" value="4" class="range" aria-label="Sensibilidade da direção">
      <div class="rl"><span>Suave</span><span>Rápida</span></div>
    </div>
    <div>
      <h2>Grande Prêmio</h2>
      <div class="tracks" id="trackList"></div>
    </div>
    <div class="pts"><span>Pontos no campeonato: <b id="myPts">0</b></span><button class="link" id="resetChamp">Reiniciar campeonato</button></div>
    <button class="go" id="start">LARGAR!</button>
  </div>
</div>
<div id="game" class="screen" hidden>
  <div id="stage"><canvas id="cv"></canvas><div id="tb"><button id="mute" aria-label="Som ligado ou desligado">♪</button><button id="quit" aria-label="Sair da corrida">✕</button></div></div>
  <div id="ctrl">
    <div id="left"></div>
    <div id="right">
      <div id="gears"><button class="pad" id="gUp">+</button><button class="pad" id="gDn">−</button></div>
      <button class="pad" id="bBrake">Freio</button>
      <button class="pad" id="bGas">Acelerar</button>
      <button class="pad" id="bNit">Nitro</button>
    </div>
  </div>
  <div id="result" hidden></div>
</div>
<script>
/* ===== Dados ===== */
const SEG = 200, ROADW = 2000, CAMH = 1000, DEPTH = 0.839, DRAW = 100;
const MAXREF = 14000, LAPS = 3, POINTS = [20, 15, 12, 9, 7, 5, 3, 2, 1];
const KMH = 330 / MAXREF;

const CARS = [
  { id: 0, name: 'Relâmpago', desc: 'Equilibrado em tudo. Bom para começar.', color: '#2f6bff', dark: '#1a3fa0', top: 0.94, acc: 0.55, turn: 1.0, grip: 1.0 },
  { id: 1, name: 'Foguete', desc: 'Motor muito potente, mas derrapa nas curvas.', color: '#e02a2a', dark: '#8e1414', top: 1.0, acc: 0.5, turn: 0.9, grip: 0.78 },
  { id: 2, name: 'Tigre', desc: 'Acelera rápido, velocidade final menor.', color: '#ffb400', dark: '#a86a00', top: 0.88, acc: 0.85, turn: 1.0, grip: 1.0 },
  { id: 3, name: 'Rochedo', desc: 'Faz curva firme, mas é o mais lento.', color: '#2fb55a', dark: '#16703a', top: 0.86, acc: 0.6, turn: 1.3, grip: 1.35 }
];
function rng(seed) { let s = seed; return () => { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; }; }

/* ===== Desenho ===== */

}
function carSprite(c, cx, by, w, col, dark, lean) {

const SKIN = ['#f1c27d', '#c68642', '#8d5524', '#ffdbac'];
const hsh = (a, b) => (Math.imul(a + 1, 73856093) ^ Math.imul(b + 7, 19349663)) >>> 0;
function decoSprite(c, k, x, y, u, v, pal, si) {

      c.fillStyle = '#2a2a3a'; c.fillRect(px - u * .03, y - ph * .36, u * .06, ph * .36);
      c.fillStyle = crowd[h % crowd.length]; c.fillRect(px - u * .04, y - ph * .78, u * .08, ph * .44);
      c.fillStyle = SKIN[(h >> 3) % 4]; c.fillRect(px - u * .03, y - ph, u * .06, u * .06);
      if (h & 1) { c.fillStyle = crowd[h % crowd.length]; c.fillRect(px - u * .065, y - ph * .98, u * .02, u * .1); c.fillRect(px + u * .045, y - ph * .98, u * .02, u * .1); }

    c.fillStyle = night ? '#f08ac0' : '#ffc4de'; c.beginPath(); c.arc(x - u * .07, y - u * .41, u * .1, 0, 7); c.arc(x + u * .08, y - u * .33, u * .09, 0, 7); c.fill();
  } else if (k === 7) { // prédio
    const bw = u * (.2 + v * .1), bh = u * (.45 + v * .55), x0 = x - bw / 2;
    c.fillStyle = night ? '#2a2450' : ['#d8c8b0', '#c9b8a0', '#e4d6c0', '#b8c4cc'][Math.floor(v * 4) % 4]; c.fillRect(x0, y - bh, bw, bh);
    c.fillStyle = night ? '#1c1738' : 'rgba(0,0,0,.12)'; c.fillRect(x0, y - bh, bw, u * .02);

    }
  } else if (k === 8) { // pinheiro com neve
    c.fillStyle = '#4a3016'; c.fillRect(x - u * .02, y - u * .1, u * .04, u * .1);

      const w = u * (.17 - i * .04), t = y - u * (.1 + i * .17);
      c.fillStyle = '#245f48'; c.beginPath(); c.moveTo(x - w, t); c.lineTo(x + w, t); c.lineTo(x, t - u * .24); c.fill();
      c.fillStyle = '#f4f8ff'; c.beginPath(); c.moveTo(x - w * .6, t - u * .09); c.lineTo(x + w * .6, t - u * .09); c.lineTo(x, t - u * .24); c.fill();
    }
  } else if (k === 9) { // outdoor
    const pw = u * .25;
    c.fillStyle = '#555'; c.fillRect(x - pw * .35, y - u * .3, u * .02, u * .3); c.fillRect(x + pw * .35, y - u * .3, u * .02, u * .3);
    c.fillStyle = ['#e53935', '#1e88e5', '#fdd835', '#43a047'][Math.floor(v * 4) % 4]; c.fillRect(x - pw / 2, y - u * .46, pw, u * .17);
    c.fillStyle = 'rgba(255,255,255,.85)'; c.fillRect(x - pw * .4, y - u * .42, pw * .8, u * .035); c.fillRect(x - pw * .4, y - u * .36, pw * .5, u * .03);
  } else if (k === 10) { // boca de lava
    c.fillStyle = '#3a2220'; c.beginPath(); c.moveTo(x - u * .15, y); c.lineTo(x - u * .05, y - u * .3); c.lineTo(x + u * .05, y - u * .3); c.lineTo(x + u * .16, y); c.fill();
    c.fillStyle = '#ff7a1a'; c.fillRect(x - u * .05, y - u * .32, u * .1, u * .04);

  } else decoOld(c, k, x, y, u, v);
}
function decoOld(c, k, x, y, u, v) {
  if (u < 1.2) return;
  if (k === 0) { c.fillStyle = '#5a3a1a'; c.fillRect(x - u * .03, y - u * .28, u * .06, u * .28); c.fillStyle = v < .5 ? '#1f6a1f' : '#2a7d2a'; c.beginPath(); c.arc(x, y - u * .4, u * .16, 0, 7); c.fill(); }
  else if (k === 1) { c.fillStyle = '#4a3016'; c.fillRect(x - u * .02, y - u * .1, u * .04, u * .1); c.fillStyle = '#1a5a35'; for (let i = 0; i < 3; i++) { const w = u * (.17 - i * .04), t = y - u * (.1 + i * .17); c.beginPath(); c.moveTo(x - w, t); c.lineTo(x + w, t); c.lineTo(x, t - u * .24); c.fill(); } }

function fmt(t) { const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1); }
function draw(r) {
  const W = cv.width, CH = cv.height, vh = Math.floor((CH - 2) / 2), pl = r.pl, ord9 = order(r), pos = ord9.indexOf(pl) + 1;
  const rival = r.rival;
  const pal = r.def.p;
  const lapN = Math.max(1, Math.min(LAPS, Math.floor(pl.prog / r.tl) + 1));
  renderView(ctx, 0, 0, W, vh, pl, r.cars.filter(c => c !== pl), r.segs, pal, pl.steerVis, pl.shake);
  renderView(ctx, 0, vh + 2, W, vh, rival, r.cars.filter(c => c !== rival), r.segs, pal, 0, 0);
  ctx.fillStyle = '#ffc400'; ctx.fillRect(0, vh, W, 2);
  // HUD jogador
  txt(ctx, 'POS ' + pos + '/' + r.cars.length, 6, 16, 10, '#ffc400');
  txt(ctx, 'VOLTA ' + lapN + '/' + LAPS, 6, 29, 7, '#fff6e0');
  txt(ctx, fmt(Math.max(0, r.t)), W - 6, 16, 10, '#fff6e0', 'right');
  txt(ctx, pl.name, W - 6, 29, 7, '#fff6e0', 'right');
  txt(ctx, Math.round(pl.speed * KMH) + ' km/h', 6, vh - 8, 12, '#fff6e0');
  txt(ctx, (cfg.gear === 'auto' ? 'A' : 'M') + pl.gear, 6, vh - 24, 8, '#ffc400');
  txt(ctx, 'NITRO', W - 6, vh - 20, 7, pl.nitroT > 0 ? '#ff6a2a' : '#fff6e0', 'right');
  for (let i = 0; i < 3; i++) { ctx.fillStyle = i < pl.charges ? '#ffc400' : '#4a3d7a'; ctx.fillRect(W - 6 - 3 * 14 + i * 14 + 2, vh - 14, 11, 6); }
  // minimapa: líder roxo, rival preto, você azul
  if (r.map) {
    const mx = W - 6 - 60, my = 36;
    ctx.drawImage(r.map.cv, mx, my);
    const dot = (o, col, rad) => {
      const p = mapPos(r, o.prog);
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(mx + p[0], my + p[1], rad + 1, 0, 7); ctx.fill();
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(mx + p[0], my + p[1], rad, 0, 7); ctx.fill();
    };
    dot(ord9[0], '#a020f0', 4.6); dot(rival, '#000000', 3); dot(pl, '#2f7bff', 3);
  }
  // HUD rival
  const y0 = vh + 2, rp = ord9.indexOf(rival) + 1;
  txt(ctx, 'RIVAL', 6, y0 + 14, 7, '#9fd8ff');
  txt(ctx, rival.name, 6, y0 + 27, 9, rival.color === '#ffffff' ? '#fff' : rival.color);
  txt(ctx, ord(rp) + ' lugar', W - 6, y0 + 16, 8, '#fff6e0', 'right');
  txt(ctx, Math.round(rival.speed * KMH) + ' km/h', 6, y0 + vh - 8, 10, '#fff6e0');
  // contagem / fim
  if (r.state === 'count') {
    txt(ctx, r.def.n.toUpperCase(), W / 2, vh * .27, 11, '#ffffff', 'center');
    txt(ctx, r.def.loc.toUpperCase(), W / 2, vh * .27 + 14, 7, '#ffc400', 'center');
    const n = Math.ceil(r.cd), s = r.cd > 3 ? '' : String(n), size = 36;
    if (s) { txt(ctx, s, W / 2, vh / 2 + 14, size, '#ffc400', 'center'); txt(ctx, s, W / 2, y0 + vh / 2 + 10, 22, '#ffc400', 'center'); }
  } else if (r.state === 'race' && r.t < .9) {
    txt(ctx, 'VAI!', W / 2, vh / 2 + 10, 28, '#3df07a', 'center');
  } else if (r.state === 'done') {
    txt(ctx, 'FIM! ' + ord(r.place) + ' LUGAR', W / 2, vh / 2 + 8, 14, '#ffc400', 'center');
  }
}
function loop(now) {
  if (!race) return;
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!wheelHeld) wheelA *= Math.max(0, 1 - dt * 9);
  const w = $('wsvg'); if (w) w.style.transform = 'rotate(' + (wheelA * 57.3).toFixed(1) + 'deg)', w.style.transformOrigin = '50% 50%';
  step(race, dt); draw(race); Snd.update(race);
  raf = requestAnimationFrame(loop);
}

/* ===== Resultado ===== */
function showResult(r) {
  r.shown = true;
  const fin = r.fins.slice(), rest = r.cars.filter(c => !c.fin).sort((a, b) => b.prog - a.prog), rank = fin.concat(rest);
  const key = c => (c.isP ? pkey() : c.name);
  rank.forEach((c, i) => { c.pts = POINTS[i] || 0; save.totals[key(c)] = (save.totals[key(c)] || 0) + c.pts; });
  const place = rank.indexOf(r.pl) + 1, ti = cfg.track;
  let note = '';
  if (place <= 3 && ti + 1 < TRACKS.length && save.unlocked < ti + 2) { save.unlocked = ti + 2; note = 'Nova pista liberada: ' + TRACKS[ti + 1].n + '!'; }
  else if (place > 3 && ti + 1 < TRACKS.length && save.unlocked < ti + 2) note = 'Termine no pódio (top 3) para liberar a próxima pista.';
  persist();
  const next = ti + 1 < TRACKS.length && save.unlocked > ti + 1;
  const head = place === 1 ? 'VITÓRIA!' : place <= 3 ? 'PÓDIO!' : ord(place) + ' LUGAR';
  const rows = rank.map((c, i) => '<tr class="' + (c.isP ? 'me' : '') + '"><td>' + (i + 1) + '</td><td>' + c.name + '</td><td class="r">+' + c.pts + '</td><td class="r">' + save.totals[key(c)] + '</td></tr>').join('');
  const el = $('result');
  el.innerHTML = '<div class="wrap"><p class="big">' + head + '</p><p class="msg">' + TRACKS[ti].n + ' · você ganhou ' + r.pl.pts + ' pontos. ' + note + '</p>' +
    '<table><thead><tr><th>Pos</th><th>Piloto</th><th class="r">Corrida</th><th class="r">Total</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div class="row">' + (next ? '<button class="btn pri" id="rNext">Próxima pista</button>' : '<button class="btn pri" id="rAgain">Correr de novo</button>') + '<button class="btn" id="rMenu">Menu</button></div>' +
    (next ? '<button class="btn" id="rAgain">Correr de novo</button>' : '') + '</div>';
  el.hidden = false;
  const again = $('rAgain'); if (again) again.onclick = startRace;
  const nx = $('rNext'); if (nx) nx.onclick = () => { cfg.track = ti + 1; persist(); startRace(); };
  $('rMenu').onclick = toMenu;
}
$('mute').onclick = () => { cfg.mute = !cfg.mute; Snd.setOn(!cfg.mute); $('mute').classList.toggle('off', cfg.mute); persist(); };
function toMenu() { race = null; Snd.stop(); cancelAnimationFrame(raf); $('game').hidden = true; $('menu').hidden = false; buildMenu(); }
$('quit').onclick = toMenu;
$('start').onclick = () => { persist(); startRace(); };
buildMenu();
</script>
